version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always

  parser:
    build: .
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
    restart: always

  logic:
    build:
      context: ./logic
      dockerfile: Dockerfile
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: always
    volumes:
      - ./data:/app/data